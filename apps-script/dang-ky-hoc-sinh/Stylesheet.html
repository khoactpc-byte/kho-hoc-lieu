<style>
  :root { --primary:#2563eb; --border:#dbe3ef; --text:#1e293b; --muted:#64748b; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:#f1f5f9; color:var(--text); font-family:Poppins,Arial,sans-serif; }
  .container { max-width:900px; margin:0 auto; background:white; border-radius:18px; padding:28px; box-shadow:0 14px 40px rgba(15,23,42,.12); }
  .form-header { text-align:center; margin-bottom:22px; }
  h1 { margin:0; color:#0f172a; }
  h3 { margin:26px 0 16px; padding-bottom:8px; border-bottom:2px solid var(--primary); color:#0f172a; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .form-group { margin-bottom:16px; }
  label { display:block; margin-bottom:6px; font-weight:700; color:#334155; }
  input, select { width:100%; padding:12px; border:1px solid var(--border); border-radius:12px; font:inherit; background:white; }
  input:focus, select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(37,99,235,.12); }
  button#submitButton { width:100%; border:0; border-radius:14px; padding:14px; background:var(--primary); color:white; font-weight:800; cursor:pointer; }
  button#submitButton:disabled { opacity:.6; cursor:not-allowed; }
  #status { margin:14px 0; font-weight:700; }
  .success { padding:12px; border-radius:12px; background:#dcfce7; color:#166534; }
  .error { padding:12px; border-radius:12px; background:#fee2e2; color:#991b1b; }
  .history-box { margin:6px 0 18px; }
  .history-row { padding:14px; border:1px solid #bbf7d0; background:#f0fdf4; border-radius:14px; margin-bottom:10px; }
  .history-note { padding:10px 12px; border:1px solid #fde68a; background:#fffbeb; color:#92400e; border-radius:12px; font-size:13px; font-weight:700; margin-bottom:10px; }
  .history-title { font-weight:800; color:#047857; margin-bottom:10px; }
  .sub-title { margin:10px 0 12px; padding:10px 12px; border-radius:12px; background:#eff6ff; color:#1d4ed8; font-weight:800; }
  .hint { margin-top:6px; color:var(--muted); font-size:13px; font-weight:600; }
  .mt-2 { margin-top:8px; }
  .error-message { color:#dc2626; font-size:12px; }
  @media (max-width:700px) { body{padding:10px}.container{padding:18px}.form-row{grid-template-columns:1fr} input,select{font-size:16px} }
</style>
