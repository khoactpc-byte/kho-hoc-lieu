<script>
  const RESULT_OPTIONS = ['Tốt', 'Khá', 'Đạt'];
  const FILE_FIELDS = ['anhKhaiSinh', 'anhCanCuoc', 'anhChanDung', 'anhHocBa'];
  const communeState = {
    current: [],
    household: []
  };

  document.addEventListener('DOMContentLoaded', function() {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(populateProvinces).getProvinces();
    } else {
      populateProvinces(['TP.HCM']);
    }
    document.getElementById('lopHoc').addEventListener('change', renderPreviousAcademic);
    setupAddressPicker('current', 'tinhThanh', 'xaPhuongInput', 'xaPhuongList');
    setupAddressPicker('household', 'tinhThanhHK', 'xaPhuongHKInput', 'xaPhuongHKList');
    document.getElementById('maDinhDanh').addEventListener('input', syncIdentityUploadRequirement);
    document.getElementById('hoVaTen').addEventListener('input', function(e) {
      const start = e.target.selectionStart;
      const end = e.target.selectionEnd;
      e.target.value = e.target.value.toLocaleUpperCase('vi-VN');
      e.target.setSelectionRange(start, end);
    });
    syncIdentityUploadRequirement();
  });

  function populateProvinces(provinces) {
    ['tinhThanh', 'tinhThanhHK'].forEach(id => {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="">-- Chọn Tỉnh/Thành --</option>';
      provinces.forEach(p => select.appendChild(new Option(p, p)));
    });
  }

  function setupAddressPicker(key, provinceId, communeInputId, datalistId) {
    document.getElementById(provinceId).addEventListener('change', () => loadCommunesForProvince(key, provinceId, communeInputId, datalistId));
    document.getElementById(communeInputId).addEventListener('input', () => renderCommuneSuggestions(key, communeInputId, datalistId));
    document.getElementById(communeInputId).addEventListener('focus', () => renderCommuneSuggestions(key, communeInputId, datalistId));
  }

  function loadCommunesForProvince(key, provinceId, communeInputId, datalistId) {
    const province = document.getElementById(provinceId).value;
    const input = document.getElementById(communeInputId);
    input.value = '';
    communeState[key] = [];
    renderCommuneSuggestions(key, communeInputId, datalistId);
    if (!province) return;
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(items => {
        communeState[key] = items || [];
        renderCommuneSuggestions(key, communeInputId, datalistId);
      }).getCommunes(province);
    }
  }

  function renderCommuneSuggestions(key, communeInputId, datalistId) {
    const list = document.getElementById(datalistId);
    const query = normalizeText(document.getElementById(communeInputId).value);
    const options = communeState[key]
      .filter(name => !query || normalizeText(name).includes(query))
      .slice(0, 80);
    list.innerHTML = options.map(name => `<option value="${escapeHtml(name)}"></option>`).join('');
  }

  function normalizeText(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/\u0111/g, 'd')
      .replace(/\u0110/g, 'd')
      .toLowerCase()
      .replace(/\s+/g, ' ')
      .trim();
  }

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function renderPreviousAcademic() {
    const grade = Number(document.getElementById('lopHoc').value || 0);
    const box = document.getElementById('previousAcademicBox');
    box.innerHTML = '';
    if (grade < 7) return;
    const note = document.createElement('div');
    note.className = 'history-note';
    note.textContent = 'Quy đổi đánh giá cũ: Trung bình = Đạt, Khá = Khá, Giỏi = Tốt.';
    box.appendChild(note);
    for (let g = 6; g < grade; g++) {
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `
        <div class="history-title">Thông tin lớp ${g}</div>
        <div class="form-row">
          <div class="form-group">
            <label>Kết quả học tập lớp ${g} *</label>
            <select name="hocLucLop${g}" required>${renderResultOptions()}</select>
          </div>
          <div class="form-group">
            <label>Kết quả hạnh kiểm lớp ${g} *</label>
            <select name="hanhKiemLop${g}" required>${renderResultOptions()}</select>
          </div>
        </div>`;
      box.appendChild(row);
    }
  }

  function renderResultOptions() {
    return '<option value="">-</option>' + RESULT_OPTIONS.map(x => `<option value="${x}">${x}</option>`).join('');
  }

  function handleFormSubmit(event) {
    event.preventDefault();
    const form = document.getElementById('myForm');
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const status = document.getElementById('status');
    const submit = document.getElementById('submitButton');
    submit.disabled = true;
    status.innerHTML = 'Đang kiểm tra hồ sơ...';

    const identityError = validateIdentityCode();
    if (identityError) {
      status.innerHTML = `<div class="error">${identityError}</div>`;
      submit.disabled = false;
      return;
    }

    const hocBaError = validateHocBaFiles();
    if (hocBaError) {
      status.innerHTML = `<div class="error">${hocBaError}</div>`;
      submit.disabled = false;
      return;
    }

    status.innerHTML = 'Đang đọc file tải lên...';

    Promise.all(FILE_FIELDS.map(id => readFilesFromInput(document.getElementById(id))))
      .then(fileData => {
        if (!(window.google && google.script && google.script.run)) {
          throw new Error('Bản xem trực tiếp trên máy chỉ để xem giao diện. Thầy cô cần chạy bằng link triển khai Apps Script để nộp hồ sơ.');
        }
        status.innerHTML = 'Đang lưu hồ sơ vào Google Sheet và Drive...';
        google.script.run
          .withSuccessHandler(response => {
            status.innerHTML = `<div class="${response.success ? 'success' : 'error'}">${response.message}</div>`;
            if (response.success) {
              form.reset();
              document.getElementById('previousAcademicBox').innerHTML = '';
            }
            submit.disabled = false;
          })
          .withFailureHandler(error => {
            status.innerHTML = `<div class="error">${error.message}</div>`;
            submit.disabled = false;
          })
          .processForm(getFormData(form), {
            anhKhaiSinh: fileData[0],
            anhCanCuoc: fileData[1],
            anhChanDung: fileData[2],
            anhHocBa: fileData[3]
          });
      })
      .catch(error => {
        status.innerHTML = `<div class="error">${error.message}</div>`;
        submit.disabled = false;
      });
  }

  function getFormData(form) {
    const obj = {};
    Array.from(form.elements).forEach(input => {
      if (input.name && input.type !== 'file' && input.type !== 'submit') obj[input.name] = input.value;
    });
    obj.hoVaTen = String(obj.hoVaTen || '').trim().toLocaleUpperCase('vi-VN');
    obj.ngaySinh = formatDateForSheet(obj.ngaySinh);
    obj.maDinhDanh = normalizeIdentityCodeValue(obj.maDinhDanh);
    return obj;
  }

  function formatDateForSheet(value) {
    const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return match ? `${match[3]}/${match[2]}/${match[1]}` : String(value || '').trim();
  }

  function readFilesFromInput(input) {
    return Promise.all(Array.from(input.files || []).map(file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ name: file.name, type: file.type, bytes: reader.result.split(',')[1] });
      reader.onerror = reject;
      reader.readAsDataURL(file);
    })));
  }

  function syncIdentityUploadRequirement() {
    const input = document.getElementById('maDinhDanh');
    const canCuocInput = document.getElementById('anhCanCuoc');
    const canCuocGroup = document.getElementById('canCuocGroup');
    const hasCode = /^\d{12}$/.test(input.value.trim());

    canCuocInput.required = hasCode;
    canCuocInput.disabled = !hasCode;
    if (!hasCode) canCuocInput.value = '';
    canCuocGroup.style.opacity = hasCode ? '1' : '.55';
  }

  function validateIdentityCode() {
    const input = document.getElementById('maDinhDanh');
    const value = normalizeIdentityCodeValue(input.value);
    if (/^\d{12}$/.test(value) || value === 'bé chưa có') {
      input.value = value;
      return '';
    }
    return 'Mã định danh phải là đúng 12 số, hoặc ghi đúng: bé chưa có';
  }

  function normalizeIdentityCodeValue(value) {
    const raw = String(value || '').trim();
    if (/^\d{12}$/.test(raw)) return raw;
    if (normalizeText(raw) === 'be chua co') return 'bé chưa có';
    return raw;
  }

  function validateHocBaFiles() {
    const files = Array.from(document.getElementById('anhHocBa').files || []);
    const pdfFiles = files.filter(file => file.type === 'application/pdf');
    const imageFiles = files.filter(file => file.type.startsWith('image/'));
    if (pdfFiles.length + imageFiles.length !== files.length) {
      return 'Học bạ chỉ nhận file PDF hoặc ảnh chụp.';
    }
    if (pdfFiles.length && imageFiles.length) {
      return 'Học bạ chỉ chọn 1 file PDF, hoặc chọn nhiều ảnh chụp. Không chọn lẫn PDF và ảnh.';
    }
    if (pdfFiles.length > 1) {
      return 'Nếu tải học bạ dạng PDF, vui lòng chọn đúng 1 file PDF đã gộp sẵn.';
    }
    return '';
  }
</script>
